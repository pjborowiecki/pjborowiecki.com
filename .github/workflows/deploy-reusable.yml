name: Deploy Cloudflare Worker

on:
  workflow_call:
    inputs:
      target:
        description: Wrangler environment to deploy (preview or production).
        required: true
        type: string

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy
    if: >-
      inputs.target == 'production' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.target == 'production' && 'Production' || 'Preview' }}
      url: ${{ inputs.target == 'production' && 'https://pjborowiecki.com' || 'https://preview.pjborowiecki.com' }}
    concurrency:
      group: cloudflare-deploy-${{ inputs.target }}
      cancel-in-progress: false
      queue: max
    env:
      DEPLOY_TARGET: ${{ inputs.target }}

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          case "$DEPLOY_TARGET" in
            preview|production) ;;
            *) echo "::error::Expected preview or production."; exit 1 ;;
          esac
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN secret in the GitHub Preview and Production environments and the CLOUDFLARE_ACCOUNT_ID repository variable. See README.md."
            exit 1
          fi

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Build Worker and verify artifacts
        run: bun run "build:$DEPLOY_TARGET"

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: vp exec wrangler deploy --config dist/server/wrangler.json

      - name: Verify the live site
        run: bun scripts/verify-deployment.ts "$DEPLOY_TARGET"
